# Production Profile Configuration
# This file contains production-safe defaults (no secrets).
# Secrets are injected via Docker secrets (common.properties, datasource.password).

# ============================================================================
# Hibernate/JPA Logging (DISABLED for production)
# ============================================================================
# Verbose SQL logging is a security and performance risk in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ============================================================================
# Configuration Management (Production Defaults)
# ============================================================================
# Operators can override via optional filesystem mount or environment variable
# org.openelisglobal.configuration.dir=/var/lib/openelis-global/configuration/backend
# org.openelisglobal.configuration.autocreate=true

# ============================================================================
# File Import Configuration
# ============================================================================
# Polling interval for file import directory watcher (milliseconds)
file.import.poll.interval=60000
# Base directory for file import configurations (path traversal boundary)
file.import.base.directory=/data/analyzer-imports

