# Builds the Linux installer tarball for a release and attaches it as a
# release asset. Runs automatically when a release is published (including
# releases created by the Release workflow), and can be invoked manually
# with a tag for testing or backfilling an older release.
name: Packaging / Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the installer to"
        required: true

jobs:
  build-installer-and-upload-installer:
    name: Build
    if: github.repository == 'DIGI-UW/OpenELIS-Global-2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

    steps:
      - name: Checkout OpenELIS-Global2 at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive

      - name: Build installer
        run: ./build.sh -ib "$RELEASE_TAG"

      - name: Check installer
        run: ls OEInstaller/linux

      - name: Upload installer as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE_PATH=$(find OEInstaller/linux -name "*.tar.gz" -print -quit)
          if [ -z "$FILE_PATH" ]; then
            echo "::error::No .tar.gz file found in OEInstaller/linux directory."
            exit 1
          fi
          echo "Uploading $FILE_PATH to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$FILE_PATH" --clobber
